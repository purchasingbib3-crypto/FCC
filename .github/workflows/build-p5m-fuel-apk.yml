name: Build P5M Fuel APK

on:
  push:
    branches: [ build-p5m-fuel-apk ]
    paths:
      - 'p5m-fuel-android/**'
      - '.github/workflows/build-p5m-fuel-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: p5m-fuel-android
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp p5m-fuel-android/app/build/outputs/apk/debug/app-debug.apk P5M-Fuel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: P5M-Fuel-APK
          path: P5M-Fuel.apk
          if-no-files-found: error
